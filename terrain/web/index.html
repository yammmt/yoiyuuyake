<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yūyake Finder — 地形確認</title><style>body{font-family:system-ui,sans-serif;background:#fff8f5;color:#252025;margin:auto;max-width:680px;padding:32px}form{display:grid;gap:12px;grid-template-columns:1fr 1fr}label{display:grid;gap:4px}button{grid-column:span 2;padding:12px;background:#56324f;color:white;border:0;border-radius:8px}#result{white-space:pre-wrap;background:white;padding:16px;border-radius:10px;border:1px solid #eadfda}.note{font-size:.9rem;color:#655}</style><h1>地形上の西空の視界</h1><p>ローカルDEMだけで確認する試作画面です。</p><form id="form"><label>緯度<input name="lat" value="35.6812" required></label><label>経度<input name="lng" value="139.7671" required></label><label>日没方位（度）<input name="azimuth" value="270"></label><label>太陽高度（度）<input name="sun_altitude" value="1"></label><button>地形視界を計算</button></form><h2>結果</h2><div id="result">地点を入力して計算してください。</div><p class="note">見晴らしは地形を考慮した推定です。建物・樹木などの遮蔽物は考慮していません。</p><script>const f=document.querySelector('#form'),r=document.querySelector('#result');f.onsubmit=async e=>{e.preventDefault();r.textContent='計算中…';const x=await fetch('/api/horizon?'+new URLSearchParams(new FormData(f)));const d=await x.json();if(!x.ok){r.textContent=d.error;return}const v=d.visibility;r.textContent=`${v.label}\n${v.description}\n最大地形角: ${v.maximum_horizon_angle_degrees.toFixed(2)}°\n遮蔽方向: ${v.obstructing_azimuth_degrees.toFixed(1)}° / ${v.obstructing_distance_meters}m\n太陽が地形に隠れそう: ${v.sun_likely_occluded?'はい':'いいえ'}`}</script></html>
